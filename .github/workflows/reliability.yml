name: Reliability repetition

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat-critical-integrations:
    name: Critical integrations x100
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            cmake g++ ninja-build openssl python3 sqlite3 \
            libssl-dev libsqlite3-dev libasio-dev libspdlog-dev \
            nlohmann-json3-dev libcli11-dev libgtest-dev pkg-config
      - name: Configure and build fault-enabled test binaries
        run: |
          cmake -S . -B build/reliability -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMINITUN_USE_SYSTEM_DEPS=ON \
            -DMINITUN_BUILD_TESTS=ON \
            -DMINITUN_ENABLE_FAULT_INJECTION=ON \
            -DMINITUN_WARNINGS_AS_ERRORS=ON
          cmake --build build/reliability --parallel 2
      - name: Repeat convergence and fault tests 100 times
        run: |
          ctest --test-dir build/reliability \
            --output-on-failure \
            --repeat until-fail:100 \
            -R '^(fault\.|integration\.(tunnel-registration|high-latency-reconciliation|tcp-relay)$)'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-failure
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/reliability/Testing/Temporary/
