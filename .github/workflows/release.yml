name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "invalid release tag: ${tag}" >&2
            exit 1
          fi

          package_version=${tag#v}
          base_version=${package_version%%-rc.*}
          project_version=$(awk '$1 == "VERSION" { print $2; exit }' CMakeLists.txt)
          if [[ -z "${project_version}" || "${base_version}" != "${project_version}" ]]; then
            echo "tag ${tag} does not match CMake project version ${project_version:-unknown}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${package_version}" == *-rc.* ]]; then
            prerelease=true
          fi

          echo "package_version=${package_version}" >>"${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >>"${GITHUB_OUTPUT}"

  packages:
    name: Build tested packages
    needs: validate-tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/package.yml
    with:
      package_version: ${{ needs.validate-tag.outputs.package_version }}
      publish_oci: true

  openwrt-repo:
    name: Publish signed OpenWrt repository
    needs:
      - validate-tag
      - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-tag.outputs.package_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download OpenWrt artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: minitun-openwrt-*
          merge-multiple: true
          path: openwrt-artifacts

      - name: Build usign
        run: |
          git clone --depth 1 https://git.openwrt.org/project/usign.git usign-src
          cmake -S usign-src -B usign-build
          cmake --build usign-build

      - name: Materialize repository signing key
        env:
          MINITUN_OPENWRT_SIGN_KEY: ${{ secrets.MINITUN_OPENWRT_SIGN_KEY }}
          MINITUN_OPENWRT_SIGN_PUB: ${{ secrets.MINITUN_OPENWRT_SIGN_PUB }}
        run: |
          if [[ -z "${MINITUN_OPENWRT_SIGN_KEY}" || -z "${MINITUN_OPENWRT_SIGN_PUB}" ]]; then
            echo "MINITUN_OPENWRT_SIGN_KEY and MINITUN_OPENWRT_SIGN_PUB secrets are required" >&2
            exit 1
          fi
          printf '%s\n' "${MINITUN_OPENWRT_SIGN_KEY}" | base64 -d > key-build
          printf '%s\n' "${MINITUN_OPENWRT_SIGN_PUB}" | base64 -d > key-build.pub
          chmod 0600 key-build
          chmod 0644 key-build.pub

      - name: Assemble and sign OpenWrt repository
        run: |
          packaging/openwrt/build-repo.sh \
            "$PWD/openwrt-artifacts/dist" \
            "$PWD/repo" \
            "$PWD/key-build" \
            "$PWD/key-build.pub" \
            "$PWD/usign-build/usign"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - packages
      - openwrt-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download DEB artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: minitun-deb-*
          merge-multiple: true
          path: release-assets/deb

      - name: Download RPM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: minitun-rpm-*
          merge-multiple: true
          path: release-assets/rpm

      - name: Download OpenWrt artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: minitun-openwrt-*
          merge-multiple: true
          path: release-assets/openwrt

      - name: Assemble and verify release assets
        env:
          PACKAGE_VERSION: ${{ needs.validate-tag.outputs.package_version }}
        run: |
          artifact_version=${PACKAGE_VERSION//~/-}
          dist_dir="release-assets/dist"
          install -d "${dist_dir}"

          # Deterministic source tarball that the OpenWrt feed consumes.
          git archive \
            --format=tar.gz \
            --prefix="minitun-${PACKAGE_VERSION}/" \
            -o "${dist_dir}/minitun-${PACKAGE_VERSION}.tar.gz" \
            HEAD
          actual_hash=$(sha256sum \
            "${dist_dir}/minitun-${PACKAGE_VERSION}.tar.gz" | awk '{ print $1 }')
          expected_hash=$(awk -F':=' '$1 == "PKG_HASH" { print $2; exit }' \
            packaging/openwrt/Makefile)
          if [[ -z "${expected_hash}" || "${actual_hash}" != "${expected_hash}" ]]; then
            echo "source tarball hash ${actual_hash} does not match PKG_HASH ${expected_hash}" >&2
            exit 1
          fi

          deb_count=0
          for package in release-assets/deb/minitun-client-*.deb \
                         release-assets/deb/minitun-server-*.deb; do
            [ -f "$package" ] || continue
            install -m 0644 "$package" "${dist_dir}/"
            deb_count=$((deb_count + 1))
          done
          [ "$deb_count" -eq 8 ] || {
            echo "expected 8 DEB packages, found ${deb_count}" >&2
            exit 1
          }

          rpm_count=0
          for package in release-assets/rpm/minitun-client-*.rpm \
                         release-assets/rpm/minitun-server-*.rpm; do
            [ -f "$package" ] || continue
            install -m 0644 "$package" "${dist_dir}/"
            rpm_count=$((rpm_count + 1))
          done
          [ "$rpm_count" -eq 8 ] || {
            echo "expected 8 RPM packages, found ${rpm_count}" >&2
            exit 1
          }

          openwrt_count=0
          while IFS= read -r package; do
            install -m 0644 "$package" "${dist_dir}/"
            openwrt_count=$((openwrt_count + 1))
          done < <(find release-assets/openwrt -type f \
            \( -name '*.apk' -o -name '*.ipk' \) | sort)
          [ "$openwrt_count" -eq 24 ] || {
            echo "expected 24 OpenWrt packages, found ${openwrt_count}" >&2
            exit 1
          }

          (cd "${dist_dir}" && \
            sha256sum ./*.tar.gz ./*.deb ./*.rpm ./*.apk ./*.ipk >SHA256SUMS)
          (cd "${dist_dir}" && sha256sum --check SHA256SUMS)

      - name: Upload assembled release artifact
        uses: actions/upload-artifact@v7
        with:
          name: minitun-release-${{ needs.validate-tag.outputs.package_version }}
          if-no-files-found: error
          retention-days: 30
          path: release-assets/dist/

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          release_arguments=(
            --generate-notes
            --title "${GITHUB_REF_NAME}"
            --verify-tag
          )
          if [[ "${PRERELEASE}" == true ]]; then
            release_arguments+=(--prerelease)
          else
            release_arguments+=(--latest)
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            release-assets/dist/* \
            "${release_arguments[@]}"
