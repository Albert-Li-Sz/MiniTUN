name: Static musl builds

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: static ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU for foreign-architecture containers
        uses: docker/setup-qemu-action@v3

      - name: Build static binaries in Alpine
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD:/src" -w /src \
            alpine:3.21 sh -eu -c '
              apk add --no-cache build-base cmake ninja openssl-dev sqlite-dev \
                linux-headers git binutils
              cmake -S . -B build-static -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DMINITUN_BUILD_TESTS=OFF \
                -DMINITUN_BUILD_PACKAGES=OFF \
                -DCMAKE_EXE_LINKER_FLAGS="-static"
              cmake --build build-static --parallel 2
              ./build-static/minitun --version
            '
          sudo chown -R "$(id -u):$(id -g)" build-static

      - name: Verify fully static binaries
        run: |
          install -d dist
          for binary in minitun minitund minitun-server minitun-p2p; do
            install -m 0755 "build-static/$binary" "dist/$binary"
            if readelf -d "dist/$binary" | grep -q NEEDED; then
              echo "$binary is not fully static" >&2
              readelf -d "dist/$binary" >&2
              exit 1
            fi
          done
          file dist/minitund

      - name: Package static archive
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="dev-${GITHUB_SHA::8}"
          fi
          tar -czf "minitun-static-${version}-${{ matrix.arch }}.tar.gz" \
            -C dist minitun minitund minitun-server minitun-p2p
          sha256sum "minitun-static-${version}-${{ matrix.arch }}.tar.gz" \
            >"minitun-static-${version}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: minitun-static-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          path: |
            minitun-static-*.tar.gz
            minitun-static-*.tar.gz.sha256

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for attempt in $(seq 1 40); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" \
                "minitun-static-${version}-${{ matrix.arch }}.tar.gz" \
                "minitun-static-${version}-${{ matrix.arch }}.tar.gz.sha256"
              exit 0
            fi
            sleep 30
          done
          echo "release was not created within the retry window" >&2
          exit 1
